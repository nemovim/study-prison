<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>MATH</title>
    </head>
    <body>
        <article>
            <h1>&lt;지율이의 수학<span style="color: red">감옥</span>&gt;</h1>
            <p id="level-p">1단계</p>
            <h2 id="quiz-h2">Quiz</h2>
            <p id="score-p">99점</p>
            <p id="wrong-p">(0)</p>
            <div id="answer-div">
                <input
                    autofocus
                    type="text"
                    id="answer-input"
                    placeholder="답을 입력하세요"
                />
                <button id="submit-btn">제출</button>
            </div>
            <p id="answer-p"></p>
        </article>
        <script src="functions.js"></script>
    </body>
</html>
